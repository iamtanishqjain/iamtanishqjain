name: 📊 Generate Profile Summary Cards

on:
  # Refresh once a day
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: summary-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Generate the dark set first, but hold the push so both themes
      # land in a single commit.
      - name: Generate cards (github_dark)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 5
          THEME: "github_dark"
          AUTO_PUSH: false

      - name: Generate cards (github light) and push
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 5
          THEME: "github"
          AUTO_PUSH: true
